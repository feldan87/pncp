<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca de Editais — PNCP</title>
  <style>
    :root {
      --roxo: #5B21B6;
      --roxo-esc: #4C1D95;
      --roxo-claro: #EDE9FE;
      --roxo-medio: #7C3AED;
      --fundo: #F5F3FF;
      --borda: #DDD6FE;
      --texto: #1E1B4B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }
    header {
      background: var(--roxo-esc);
      color: #fff;
      padding: 18px 24px;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: .85;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 24px;
    }
    .filtros {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 18px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 14px;
      align-items: end;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .campo {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .campo label {
      font-size: 12px;
      font-weight: 600;
      color: #5B21B6;
    }
    .campo input,
    .campo select {
      padding: 9px 12px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      transition: border-color .15s;
    }
    .campo input:focus,
    .campo select:focus {
      outline: none;
      border-color: var(--roxo-medio);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, .15);
    }
    .acoes {
      display: flex;
      gap: 8px;
    }
    button {
      background: var(--roxo);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover {
      background: var(--roxo-esc);
    }
    button.sec {
      background: #fff;
      color: var(--roxo);
      border: 1px solid var(--roxo);
    }
    button.sec:hover {
      background: var(--roxo-claro);
    }
    .status {
      margin: 16px 2px;
      font-size: 14px;
      color: #5B21B6;
      min-height: 20px;
    }
    .tabela-wrap {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 12px;
      overflow: auto;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }
    th, td {
      padding: 11px 14px;
      text-align: left;
      border-bottom: 1px solid #F3E8FF;
      vertical-align: top;
    }
    th {
      background: var(--roxo-claro);
      color: var(--roxo-esc);
      position: sticky;
      top: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
      font-weight: 600;
    }
    tr:hover td {
      background: #FAF5FF;
    }
    td.num {
      text-align: right;
      white-space: nowrap;
    }
    .desc {
      max-width: 380px;
    }
    .paginacao {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }
    .paginacao span {
      font-size: 14px;
      color: #5B21B6;
    }
    .paginacao button {
      background: #fff;
      color: var(--roxo);
      border: 1px solid var(--borda);
      padding: 8px 14px;
    }
    .paginacao button:hover {
      background: var(--roxo-claro);
      border-color: var(--roxo);
    }
    a.link {
      color: var(--roxo-medio);
      text-decoration: none;
      font-weight: 500;
    }
    a.link:hover {
      text-decoration: underline;
    }
    @media (max-width: 900px) {
      .filtros {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Busca de Editais — PNCP</h1>
    <p>Consulta direta ao Portal Nacional de Contratações Públicas</p>
  </header>

  <div class="container">
    <form id="form" class="filtros">
      <div class="campo">
        <label>Palavra-chave</label>
        <input type="text" id="q" placeholder="ex.: software, merenda, pavimentação">
      </div>
      <div class="campo">
        <label>UF</label>
        <select id="uf">
          <option value="">Todas</option>
          <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
          <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
          <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
          <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
          <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
          <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
          <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
          <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
          <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
        </select>
      </div>
      <div class="campo">
        <label>Esfera</label>
        <select id="esfera">
          <option value="">Todas</option>
          <option value="Federal">Federal</option>
          <option value="Estadual">Estadual</option>
          <option value="Municipal">Municipal</option>
        </select>
      </div>
      <div class="campo">
        <label>Status</label>
        <select id="status">
          <option value="recebendo_proposta">A Receber / Recebendo proposta</option>
          <option value="encerrado">Encerrado</option>
          <option value="">Todos</option>
        </select>
      </div>
      <div class="acoes">
        <button type="submit">Buscar</button>
        <button type="button" class="sec" id="btnCsv">Planilha</button>
      </div>
    </form>

    <div class="status" id="statusMsg">Preencha os filtros e clique em Buscar.</div>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Local</th>
            <th>Órgão</th>
            <th>Data fim</th>
            <th>Item</th>
            <th>Descrição</th>
            <th>Qtd.</th>
            <th>Vlr. unitário</th>
            <th>Vlr. total</th>
          </tr>
        </thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>

    <div class="paginacao">
      <button type="button" id="ant">‹ Anterior</button>
      <span id="pagInfo">Página 1</span>
      <button type="button" id="prox">Próxima ›</button>
    </div>
  </div>

  <script>
    let pagina = 1;
    const $ = id => document.getElementById(id);

    const fmtData = v => {
      if (!v) return "—";
      try {
        const d = new Date(v);
        return d.toLocaleDateString("pt-BR");
      } catch { return v; }
    };
    const fmtMoeda = v => (v === null || v === undefined || v === "") ? "—"
      : Number(v).toLocaleString("pt-br", { style: "currency", currency: "BRL" });
    const fmtNum = v => (v === null || v === undefined || v === "") ? "—"
      : Number(v).toLocaleString("pt-br", { maximumFractionDigits: 4 });

    function params() {
      const p = new URLSearchParams();
      p.set("q", $("q").value.trim());
      p.set("uf", $("uf").value);
      p.set("esfera", $("esfera").value);
      p.set("status", $("status").value);
      p.set("pagina", pagina);
      return p;
    }

    async function buscar() {
      $("statusMsg").textContent = "Buscando no PNCP...";
      $("corpo").innerHTML = "";
      try {
        const r = await fetch("/api/buscar?" + params().toString());
        const data = await r.json();
        if (data.erro) {
          $("statusMsg").textContent = "Erro: " + data.erro;
          return;
        }
        render(data);
      } catch (e) {
        $("statusMsg").textContent = "Falha na conexão: " + e.message;
      }
    }

    function render(data) {
      const corpo = $("corpo");
      if (!data.linhas.length) {
        $("statusMsg").textContent = "Nenhum resultado para os filtros informados.";
      } else {
        $("statusMsg").textContent =
          `${data.linhas.length} item(ns) em ${data.total_editais} edital(is) encontrados — página ${data.pagina}.`;
      }
      data.linhas.forEach(l => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${l.local || "—"}</td>
          <td>${l.orgao || "—"}</td>
          <td>${fmtData(l.data_fim)}</td>
          <td class="num">${l.item ?? "—"}</td>
          <td class="desc">${l.descricao || "—"}
            ${l.link ? `<br><a class="link" href="${l.link}" target="_blank">ver edital ↗</a>` : ""}</td>
          <td class="num">${fmtNum(l.quantidade)}${l.unidade ? " " + l.unidade : ""}</td>
          <td class="num">${fmtMoeda(l.valor_unitario)}</td>
          <td class="num">${fmtMoeda(l.valor_total)}</td>`;
        corpo.appendChild(tr);
      });
      $("pagInfo").textContent = "Página " + data.pagina;
    }

    $("form").addEventListener("submit", e => {
      e.preventDefault();
      pagina = 1;
      buscar();
    });
    $("ant").addEventListener("click", () => {
      if (pagina > 1) {
        pagina--;
        buscar();
      }
    });
    $("prox").addEventListener("click", () => {
      pagina++;
      buscar();
    });
    $("btnCsv").addEventListener("click", () => {
      window.location = "/api/exportar?" + params().toString();
    });
  </script>
</body>
</html>
